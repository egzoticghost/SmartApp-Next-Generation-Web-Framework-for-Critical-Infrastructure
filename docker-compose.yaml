version: "3.9"

services:
  gateway:
    image: nginx:alpine
    container_name: smart_gateway
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - smartapp_client
      - smart_api
    networks:
      - smartapp-network

  postgres:
    image: postgres:18
    container_name: smart_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: SmartAppDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartapp-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: smart_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: keycloak.local
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: "edge"
    command: start-dev
    networks:
      - smartapp-network

  smart_api:
    build:
      context: ./SmartWebApi
      dockerfile: Dockerfile
    container_name: smart_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=SmartAppDB;Username=postgres;Password=mysecretpassword
    networks:
      - smartapp-network

  smartapp_client:
    build:
      context: ./SmartApp
      dockerfile: Dockerfile
    container_name: smart_client
    networks:
      - smartapp-network

volumes:
  postgres_data:

networks:
  smartapp-network:
    driver: bridge